{% extends "ops/base.html" %}
{% block title %}Verification code — {{ label }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px;">
    <h2>Verification code</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/ops/{{ portal }}/mfa">
        <label for="code">Six-digit code from your authenticator</label>
        <input type="text" id="code" name="code" inputmode="numeric"
               pattern="[0-9]*" maxlength="6" autocomplete="one-time-code"
               required autofocus>
        <button type="submit">Verify</button>
    </form>
    <p class="note">
        Your role requires a second factor. Each code works once — if you
        have just used one, wait for the next.
    </p>
</div>
{% endblock %}
