name: TEMPORARY — look at share counts behind 0.0x P/FCF

# Read-only. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-prices.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          python3 -u - <<'PY'
          import gzip, json, time, urllib.request
          SEC = {"User-Agent": "market-pulse-research admin@focusedops.io", "Accept-Encoding": "gzip, deflate"}
          def facts(cik):
              with urllib.request.urlopen(urllib.request.Request(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json", headers=SEC), timeout=60) as r:
                  b = r.read()
                  return json.loads(gzip.decompress(b) if r.headers.get("Content-Encoding") == "gzip" else b)["facts"]
          for name, cik in (("MCD", 63908), ("COP", 1163165), ("DDS", 28917), ("UCTT", 1275014)):
              f = facts(cik)
              for tag in ("WeightedAverageNumberOfDilutedSharesOutstanding", "WeightedAverageNumberOfSharesOutstandingBasic"):
                  rows = [r for r in f.get("us-gaap", {}).get(tag, {}).get("units", {}).get("shares", [])
                          if r.get("form") in ("10-K", "10-K/A") and r.get("fp") == "FY"]
                  keep = {}
                  for r in rows:
                      keep[r["fy"]] = (r.get("end"), r.get("filed"), r.get("val"))
                  print(f"== {name} {tag}: {len(rows)} annual facts; kept per fy:")
                  for fy in sorted(keep)[-11:]:
                      print("    ", fy, keep[fy])
              time.sleep(0.3)
          PY
