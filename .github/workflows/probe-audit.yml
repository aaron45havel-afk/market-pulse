name: TEMPORARY — Lynch units check on the newly unverified

# Read-only. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-audit.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 -u - <<'PY'
          import gzip, json, sys, time, urllib.request
          sys.path.insert(0, ".")
          import lynch as L
          SEC = {"User-Agent": "market-pulse-research admin@focusedops.io", "Accept-Encoding": "gzip, deflate"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=SEC), timeout=60) as r:
                  b = r.read()
                  return json.loads(gzip.decompress(b) if r.headers.get("Content-Encoding") == "gzip" else b)
          tick = get("https://www.sec.gov/files/company_tickers.json")
          cik = {v["ticker"]: int(v["cik_str"]) for v in tick.values()}
          T = "AIRO BE BRCB BUDA CAMT CMCM CWEN DDL DKNG DSP EE EH EL EYPT FLOC FXHO GOGO HOVNP IIIV INR KELYB LINC MDIA NEGG NNDM NVMI OM PTRN RSKD SEI SSP SWBI TEM VHI VIOT VNOM VTEX WSE YSG".split()
          def last(d, n=3):
              return {k: d[k] for k in sorted(d)[-n:]}
          for t in T:
              if t not in cik: print("no cik", t); continue
              try:
                  facts = get(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik[t]:010d}.json")
              except Exception as e:
                  print(t, "fetch failed", e); continue
              time.sleep(0.15)
              eps, concept, unit = L.eps_series(facts)
              ni, _ = L.annual_series(facts, "NetIncomeLoss")
              w = L.weighted_shares(facts)
              wd, _ = L.annual_series(facts, ["WeightedAverageNumberOfDilutedSharesOutstanding"], unit="shares")
              wb, _ = L.annual_series(facts, ["WeightedAverageNumberOfSharesOutstandingBasic"], unit="shares")
              cur = L.current_shares(facts, "2026-09-28")
              ni2, fixed = L.rescale_net_income(ni, eps, w)
              y = max(eps) if eps else None
              e = eps.get(y) if y else None
              n_same = ni2.get(y); n_last = ni2[max(ni2)] if ni2 else None
              print(f"== {t} {concept} {unit} eps_year={y} eps={e} rescaled={fixed}")
              print(f"   ni_same={n_same} ni_last={n_last} ({max(ni2) if ni2 else None})")
              print(f"   weighted={w.get(y)} dil={wd.get(y)} basic={wb.get(y)} current={cur}")
              print(f"   check weighted={L.units_check(e, w.get(y) or cur, n_same if n_same is not None else n_last)}")
              print(f"   check current ={L.units_check(e, cur, n_last)}")
              print(f"   eps last={last(eps)} ni last={last(ni2)} w last={last(w)}")
          PY
