name: Refresh ZIP climate (NOAA normals)

# NOAA 1991–2020 U.S. Climate Normals -> market-pulse-v21/data/zip_climate.json, read by /multifamily's weather and
# hazard filters. Quarterly, on the 3rd — after refresh-national-zips (1st)
# has added any new ZIPs. The source itself changes rarely; the re-run is
# for new ZIPs and to notice if the source changes shape.
#
# The script EXITS NON-ZERO rather than publish a file that lost its
# columns or a chunk of its coverage (see its docstring), so a red run here
# means the committed file was deliberately left alone.
on:
  schedule:
    - cron: '0 6 3 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      force:
        description: "Publish despite the coverage guards (only for an expected change)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-zip-climate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The rules and the glue are pure; their suites gate the fetch.
      - name: Prove the rules before running them
        working-directory: market-pulse-v21
        run: |
          python tests/test_zip_env.py
          python tests/test_zip_env_fetch.py

      - name: Build zip_climate.json
        working-directory: market-pulse-v21
        run: python scripts/refresh_zip_climate.py ${{ inputs.force && '--force' || '' }}

      - name: Commit if it changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/zip_climate.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh zip_climate.json

          Auto-generated by .github/workflows/refresh-zip-climate.yml."
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "push failed, rebasing and retrying ($i)"
            git pull --rebase --autostash
            sleep $((i * 3))
          done
          echo "could not push after 4 attempts" >&2
          exit 1
