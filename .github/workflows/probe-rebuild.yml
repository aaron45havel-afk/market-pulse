name: TEMPORARY — rebuild Lynch and the 100-bagger on the branch

# Branch data run for #2 (unmeasured shown as unmeasured). Commits the rebuilt
# snapshots to this branch for review. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-rebuild.yml'

permissions:
  contents: write

jobs:
  lynch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Suites first
        run: |
          python tests/test_lynch.py
          python tests/test_pricefeed.py
          python tests/test_schloss.py
      - name: Lynch
        run: python -u scripts/refresh_lynch_screener.py
      - name: Commit to this branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/lynch_snapshots
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: Lynch rebuild (branch data run)"
          for i in 1 2 3 4; do git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && exit 0; sleep $((i*5)); git pull --rebase origin claude/legal-rep-invoice-tracking-9j1i9r; done; exit 1

  hundred:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Suites first
        run: |
          python tests/test_checklist.py
          python tests/test_hundred_build.py
          python tests/test_lynch.py
          python tests/test_pricefeed.py
      - name: 100-bagger
        run: python -u scripts/refresh_hundred.py --force
      - name: Commit to this branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/hundred_snapshots
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: 100-bagger rebuild (branch data run)"
          for i in 1 2 3 4; do git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && exit 0; sleep $((i*5)); git pull --rebase origin claude/legal-rep-invoice-tracking-9j1i9r; done; exit 1
