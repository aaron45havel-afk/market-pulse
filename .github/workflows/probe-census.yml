name: TEMPORARY — does CENSUS_API_KEY work?

# One request with the new key (re-run after the secret was corrected);
# prints only whether Census answered with
# data. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-census.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One ACS request with the key
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          key = os.environ.get("CENSUS_API_KEY", "").strip()
          print(f"key present: {bool(key)}, {len(key)} chars")
          for vintage in (2023, 2024):
              url = (f"https://api.census.gov/data/{vintage}/acs/acs5"
                     f"?get=NAME,B25003_003E&for=state:39&key={key}")
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      body = r.read().decode("utf-8", "replace")
                      print(f"ACS {vintage}: HTTP {r.status} — {body[:120]!r}")
              except urllib.error.HTTPError as e:
                  print(f"ACS {vintage}: HTTP {e.code} — {e.read()[:200]!r}")
          PY
