name: TEMPORARY — national ZIP rebuild with keyless Census ACS

# Runs the real monthly rebuild on the working branch: Census ACS from the
# Bureau's bulk files (no key), and the rent-ladder columns carried across
# the new database. Commits zips.db to the working branch so the page can be
# checked before merge. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-census.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Before — rent tiers and ACS coverage in the committed zips.db
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/zips.db")
          print(c.execute("select rent_tier, count(*) from zips group by 1").fetchall())
          print(c.execute("select count(*), sum(pct_renter_occupied is not null), sum(median_household_income is not null) from zips").fetchone())
          PY
      - name: Prove the Census parser and the rent carry
        run: python tests/test_acs_bulk.py
      - name: Rebuild
        run: python -u scripts/build_national_zips.py
      - name: After
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/zips.db")
          print("rent tiers:", c.execute("select rent_tier, count(*) from zips group by 1").fetchall())
          cols = ("median_household_income", "pct_bachelors", "pct_renter_occupied", "pct_multi_unit",
                  "pct_2_4_units", "pct_rent_burdened", "pct_pre_1960", "median_year_built", "pct_age_25_34")
          n = c.execute("select count(*) from zips").fetchone()[0]
          for col in cols:
              k = c.execute(f"select count({col}) from zips").fetchone()[0]
              print(f"  {col:<26} {k:>6,} / {n:,}  ({k / n:.1%})")
          for z in ("44107", "43215", "45202", "10025", "94110", "73301"):
              print(" ", z, c.execute("select name, median_household_income, pct_renter_occupied, pct_2_4_units, pct_age_25_34, median_rent_monthly, rent_tier from zips where zip=?", (z,)).fetchone())
          PY
      - name: Commit zips.db to the working branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/zips.db
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: national ZIP rebuild with keyless Census ACS (2020-2024)"
          for i in 1 2 3 4; do git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && exit 0; sleep $((i * 5)); git pull --rebase origin claude/legal-rep-invoice-tracking-9j1i9r || true; done
          exit 1
