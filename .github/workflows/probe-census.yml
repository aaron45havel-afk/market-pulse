name: TEMPORARY — find the keyless Census ACS files

# Checks which ACS 5-year table-based summary files exist on www2.census.gov
# (no key), their size, header, and what a ZIP (ZCTA) row looks like.
# Read-only. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-census.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Vintages, sizes, headers, a ZCTA row
        run: |
          python3 - <<'PY'
          import re, time, urllib.request, urllib.error
          UA = {"User-Agent": "MarketPulse/1.0 (acs bulk probe)"}
          def head(url):
              try:
                  req = urllib.request.Request(url, headers=UA, method="HEAD")
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.headers.get("content-length"), r.headers.get("last-modified")
              except urllib.error.HTTPError as e:
                  return e.code, None, None
              except Exception as e:
                  return repr(e)[:80], None, None
          root = "https://www2.census.gov/programs-surveys/acs/summary_file"
          for y in (2022, 2023, 2024, 2025):
              st, n, lm = head(f"{root}/{y}/table-based-SF/data/5YRData/acsdt5y{y}-b25003.dat")
              print(f"{y} b25003: {st} {n} bytes, modified {lm}")
          # directory listing for the newest vintage that exists
          for y in (2025, 2024, 2023):
              try:
                  with urllib.request.urlopen(urllib.request.Request(f"{root}/{y}/table-based-SF/data/5YRData/", headers=UA), timeout=60) as r:
                      html = r.read().decode("utf-8", "replace")
                  names = re.findall(r'href="(acsdt5y\d+-[a-z0-9]+\.dat)"', html)
                  print(f"{y}: {len(names)} table files; ours:",
                        [n for n in names if any(t in n for t in ("b19013.", "b15003.", "b01003.", "b01001.", "b25003.", "b25024.", "b25070.", "b25034.", "b25035."))])
                  docs = f"{root}/{y}/table-based-SF/documentation/"
                  with urllib.request.urlopen(urllib.request.Request(docs, headers=UA), timeout=60) as r:
                      print("  docs:", re.findall(r'href="([^"?/][^"]*)"', r.read().decode("utf-8", "replace"))[:20])
                  break
              except Exception as e:
                  print(f"{y}: no listing ({e!r:.80})")
          # stream one table until a few ZCTA rows appear; time the full read
          for tbl in ("b25003", "b01001"):
              url = f"{root}/{y}/table-based-SF/data/5YRData/acsdt5y{y}-{tbl}.dat"
              t = time.time(); n = zc = 0; sample = []
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=300) as r:
                  header = r.readline().decode().rstrip("\n")
                  for raw in r:
                      n += 1
                      line = raw.decode("utf-8", "replace")
                      if line.startswith("860Z200US"):
                          zc += 1
                          if len(sample) < 2:
                              sample.append(line[:220].rstrip())
              print(f"{tbl}: {n:,} rows, {zc:,} ZCTA rows, {time.time()-t:.0f}s")
              print("  header:", header[:260])
              print("  sample:", sample)
              prefixes = {}
          PY
