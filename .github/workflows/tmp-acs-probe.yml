# TEMPORARY: which Census bulk files carry the 2015-2019 ZCTA income? Deleted before the PR.
name: TEMP ACS 2019 probe
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths: ['.github/workflows/tmp-acs-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          B=https://www2.census.gov/programs-surveys/acs/summary_file
          for y in 2019 2020 2021; do
            u="$B/$y/table-based-SF/data/5YRData/acsdt5y$y-b19013.dat"
            echo "table-based $y: $(curl -s -o /dev/null -w '%{http_code} %{size_download}' -I "$u")"
          done
          echo "--- 2019 table-based head (if any)"
          curl -s --max-time 60 "$B/2019/table-based-SF/data/5YRData/acsdt5y2019-b19013.dat" | head -c 400; echo
          curl -s --max-time 60 "$B/2019/table-based-SF/data/5YRData/acsdt5y2019-b19013.dat" | grep -m3 "^860" ; echo
          echo "--- 2019 summary_file listings"
          for p in "2019/" "2019/data/" "2019/data/5_year_seq_by_state/" "2019/data/5_year_seq_by_state/UnitedStates/" "2019/data/5_year_seq_by_state/UnitedStates/All_Geographies_Not_Tracts_Block_Groups/" "2019/documentation/user_tools/"; do
            echo "== $p"; curl -s --max-time 60 "$B/$p" | grep -o 'href="[^"?]*"' | head -25 | tr '\n' ' '; echo
          done
