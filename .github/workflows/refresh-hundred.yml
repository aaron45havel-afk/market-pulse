name: Refresh 100-bagger checklist snapshot

# Monthly snapshot of the 100-bagger checklist. Thresholds live in
# checklist.py, are re-exported into the snapshot's _meta.rules, and the
# page templates its own copy from that payload — so this comment is the
# only place a stale number can hide, and it deliberately names none.
#
# SEVEN OF THE THIRTEEN CRITERIA ARE SCOREABLE. Six cannot be answered from
# any free machine-readable source and are never scored for any company.
# That is a property of the data, not of this workflow, and the page says
# so on every row.
#
# Runs after the Lynch screener so the SEC API is not taking two hits at
# once, and reuses the same companyfacts cache key — a same-runner cache
# miss is the normal case, so budget for the full pull.

on:
  schedule:
    - cron: '0 13 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Publish even if the listed count collapses. The script refuses to
          overwrite a board when the new one keeps under 40% of the previous
          snapshot's names, on the theory that a broken parser is likelier
          than a market that repriced that hard. On the first run after a
          screener change the collapse is the intended outcome, and without
          this box that run has no way to finish.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: pip install -r requirements.txt

      # Before any network call. Every defect these screens shipped was a
      # pure function over a facts dict, reachable by a fixture in under a
      # second — and the committed snapshot WAS the fixture.
      - name: Verify the arithmetic before spending any API calls
        run: |
          python tests/test_checklist.py
          python tests/test_lynch.py
          python tests/test_schloss.py
          python tests/test_pricefeed.py

      - name: Snapshot the 100-bagger checklist
        run: python scripts/refresh_hundred.py ${{ inputs.force && '--force' || '' }}

      - name: Commit + push if changed
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/hundred_snapshots
          if git diff --staged --quiet -- market-pulse-v21/data/hundred_snapshots; then
            echo "No change to hundred_snapshots — nothing to commit."
            exit 0
          fi
          git commit -m "chore: monthly 100-bagger checklist snapshot

          Auto-generated by .github/workflows/refresh-hundred.yml.
          Sources are recorded in the snapshot's _meta.source."
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push attempt $attempt failed — pulling rebase and retrying."
            sleep $((attempt * 5))
            git pull --rebase origin main || true
          done
          git push origin HEAD:main
