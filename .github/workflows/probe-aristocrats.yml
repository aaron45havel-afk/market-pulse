name: TEMPORARY — SEC payout and leverage inputs for the aristocrats (5-year)

# Read-only. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-aristocrats.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 -u - <<'PY'
          import gzip, json, sys, time, urllib.request, urllib.error
          sys.path.insert(0, "."); sys.path.insert(0, "scripts")
          import aristocrats as A, lynch as L
          import refresh_compounders as R
          SEC = {"User-Agent": "market-pulse-research admin@focusedops.io", "Accept-Encoding": "gzip, deflate"}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=SEC), timeout=60) as r:
                      b = r.read()
                      return json.loads(gzip.decompress(b) if r.headers.get("Content-Encoding") == "gzip" else b)
              except urllib.error.HTTPError as e:
                  return {"_status": e.code}
          tick = get("https://www.sec.gov/files/company_tickers.json")
          cik = {}
          for k in sorted(tick, key=int):
              cik.setdefault(tick[k]["ticker"].upper(), int(tick[k]["cik_str"]))
          G, I = "us-gaap", "ifrs-full"
          LISTS = {
              "eps": [(G, "EarningsPerShareDiluted"), (G, "EarningsPerShareBasic"),
                      (I, "DilutedEarningsLossPerShare"), (I, "BasicEarningsLossPerShare")],
              "dps": [(G, "CommonStockDividendsPerShareDeclared"), (G, "CommonStockDividendsPerShareCashPaid"),
                      (I, "DividendsRecognisedAsDistributionsToOwnersPerShare")],
              "div_paid": [(G, "PaymentsOfDividendsCommonStock"), (G, "PaymentsOfDividends"),
                           (G, "PaymentsOfOrdinaryDividends"), (G, "DividendsCommonStockCash"), (G, "DividendsCommonStock"),
                           (I, "DividendsPaidClassifiedAsFinancingActivities"), (I, "DividendsPaid"),
                           (I, "DividendsPaidToEquityHoldersOfParentClassifiedAsFinancingActivities")],
              "da": [(G, "DepreciationDepletionAndAmortization"), (G, "DepreciationAndAmortization"),
                     (G, "DepreciationAmortizationAndAccretionNet"), (G, "Depreciation"),
                     (I, "DepreciationAndAmortisationExpense"),
                     (I, "DepreciationAmortisationAndImpairmentLossReversalOfImpairmentLossRecognisedInProfitOrLoss"),
                     (I, "AdjustmentsForDepreciationAndAmortisationExpense"), (I, "DepreciationExpense")],
              "amort": [(G, "AmortizationOfIntangibleAssets"), (I, "AmortisationExpense")],
          }
          out = []
          for a in A.UNIVERSE:
              t = a["t"]
              row = {"t": t, "sec": a["sec"], "c": a["c"], "low": bool(a.get("low_hurdle")),
                     "seed_po": a.get("po"), "seed_nd": a.get("nd")}
              c = cik.get(t.upper()) or cik.get(t.upper().replace("-", "."))
              row["cik"] = c
              if not c:
                  row["basis"] = "no_sec_listing"; out.append(row); print("ROW", json.dumps(row)); continue
              facts = get(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{c:010d}.json")
              time.sleep(0.15)
              if "_status" in facts:
                  row["basis"] = f"http_{facts['_status']}"; out.append(row); print("ROW", json.dumps(row)); continue
              row["basis"] = L.statements_basis(facts)
              f = facts.get("facts") or {}
              money = {}
              for key in ("net_income", "ocf", "capex", "op_income", "revenue"):
                  s, u = R._annual_series(f, R.TAGS[key], "USD")
                  money[key] = (s, u)
              currency = money["revenue"][1] or money["net_income"][1] or "USD"
              row["currency"] = currency
              def latest(key, unit):
                  s, u = R._annual_series(f, LISTS[key] if key in LISTS else R.TAGS[key], unit)
                  row[key + "_hist"] = {str(y): s[y] for y in sorted(s)[-6:]} if s else {}
                  if not s: return None, None, u
                  y = max(s); return y, s[y], u
              for key in ("net_income", "ocf", "capex", "op_income", "revenue"):
                  y, v, u = latest(key, currency)
                  row[key] = v; row[key + "_fy"] = y; row[key + "_unit"] = u
              for key in ("div_paid", "da", "amort"):
                  y, v, u = latest(key, currency)
                  row[key] = v; row[key + "_fy"] = y; row[key + "_unit"] = u
              for key in ("eps", "dps"):
                  best = None
                  for tax, tag in LISTS[key]:
                      for unit, rows_ in (((f.get(tax) or {}).get(tag) or {}).get("units") or {}).items():
                          if "/shares" not in unit: continue
                          s = R._annual_series(f, [(tax, tag)], unit)[0]
                          if s:
                              y = max(s)
                              if best is None or y > best[0]: best = (y, s[y], unit, tag, s)
                  if best:
                      row[key + "_fy"], row[key], row[key + "_unit"], row[key + "_tag"] = best[:4]
                      row[key + "_hist"] = {str(y): best[4][y] for y in sorted(best[4])[-6:]}
              bs = R.balance_sheet(f, want_unit=currency, revenue=row.get("revenue"))
              row.update({"debt": bs["total_debt"], "cash": bs["cash"], "bs_as_of": bs["as_of"],
                          "bs_unit": bs["unit"], "bs_notes": bs["notes"], "debt_zero_as_of": bs.get("debt_zero_as_of")})
              out.append(row)
              print("ROW", json.dumps(row, default=str))
          print("DONE", len(out))
          PY
