# TEMPORARY: probe Realtor.com state and country core-metrics files. Deleted before the PR.
name: TEMP RDC state probe
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths: ['.github/workflows/tmp-rdc-state-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: bash
        run: |
          set +e
          R=https://econdata.s3-us-west-2.amazonaws.com/Reports/Core
          for f in RDC_Inventory_Core_Metrics_State.csv RDC_Inventory_Core_Metrics_State_History.csv RDC_Inventory_Core_Metrics_Country.csv RDC_Inventory_Core_Metrics_Country_History.csv RDC_Inventory_Core_Metrics_Metro.csv; do
            echo "=== $f $(curl -s -o /dev/null -w '%{http_code} %{size_download}' -I "$R/$f")"
            curl -s --max-time 120 "$R/$f" -o f.csv
            echo "bytes $(wc -c < f.csv) lines $(wc -l < f.csv)"
            head -3 f.csv | cut -c1-900
            echo "--- tail"; tail -3 f.csv | cut -c1-400
            echo "--- months"; cut -d, -f1 f.csv | sort | uniq -c | sort -k2 | tail -4
          done
          curl -s "$R/RDC_Inventory_Core_Metrics_State_History.csv" -o h.csv
          echo "=== MT/Montana rows (latest 3)"; grep -i ",montana," h.csv | head -3 | cut -c1-500
          echo "=== distinct state keys in latest month"; awk -F, 'NR>1 && $1==202609 {print $3}' h.csv | sort | tr '\n' ' '
