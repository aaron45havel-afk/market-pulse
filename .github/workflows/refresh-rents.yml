name: Refresh rent ladder

# Fills the rent columns in market-pulse-v21/data/zips.db from MEASURED
# sources only — Zillow ZORI, HUD SAFMR/FMR, Census ACS B25064 — in the
# precedence rent_ladder.py defines.
#
# WHAT THIS REPLACED. median_rent_monthly used to fall back to
# `home_value / 17 / 12` for any ZIP outside Zillow's ZORI file: 17,358
# of 25,774 ZIPs, 67% of the country and 73% of Ohio. That is the home
# value divided by 204, so every cap rate built on it was arithmetic
# performed on itself — all 17,358 imputed ZIPs shared five distinct cap
# rates, each 5.88% by construction. Nothing is imputed now. A ZIP with
# no measured rent gets no rent and no yield.
#
# Runs on the 2nd, after refresh-national-zips rebuilds the DB on the
# 1st — this job only ever UPDATEs the rent columns of rows that already
# exist, so it has to follow the rebuild rather than race it.
#
# KEYS. CENSUS_API_KEY already exists for the state ACS job. HUD_API_TOKEN
# is free from https://www.huduser.gov/portal/dataset/fmr-api.html — the
# HUD tiers are skipped with a warning if it is unset, and ZORI + ACS
# still land, so the job is useful before the token is ever added.

on:
  schedule:
    - cron: '0 16 2 * *'   # 16:00 UTC on the 2nd
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report coverage without writing'
        required: false
        type: boolean
        default: false
      skip_hud:
        description: 'Skip the HUD tiers (ZORI + ACS only)'
        required: false
        type: boolean
        default: false
      states:
        description: 'Limit the HUD pull to these states, e.g. OH,PA'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Runs before any network call. Both suites are pure — no fixtures
      # are fetched — so a parser regression fails here in seconds rather
      # than after an hour of HUD requests.
      - name: Verify the ladder + parsers before spending any API calls
        run: |
          python tests/test_rent_ladder.py
          python tests/test_rents_build.py

      - name: Refresh rents
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: |
          set -euo pipefail
          # Plain `[ -n "$x" ] && ARGS=...` returns 1 when the input is
          # empty, and under `set -e` that ends the job before it starts.
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.skip_hud }}" = "true" ]; then ARGS="$ARGS --skip-hud"; fi
          if [ -n "${{ inputs.states }}" ]; then ARGS="$ARGS --states ${{ inputs.states }}"; fi
          echo "Running with:${ARGS:- built-in defaults}"
          python scripts/refresh_rents.py $ARGS

      - name: Commit + push if changed
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, THEN check the staged diff — `git diff` alone
          # ignores an untracked file, same trap the national-zips job
          # documents.
          git add market-pulse-v21/data/zips.db
          if git diff --staged --quiet -- market-pulse-v21/data/zips.db; then
            echo "No change to zips.db — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh rent ladder

          Auto-generated by .github/workflows/refresh-rents.yml.
          Zillow ZORI, HUD SAFMR/FMR and Census ACS B25064, in that
          precedence. Nothing is imputed — a ZIP with no measured rent
          carries no rent and no cap rate."
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push attempt $attempt failed — pulling rebase and retrying."
            sleep $((attempt * 5))
            git pull --rebase origin main || true
          done
          git push origin HEAD:main
