# TEMPORARY: rebuild compounders.json on this branch with the parent-share attribution (run 3: loss years borrow the nearest ownership share). Deleted before the PR.
name: TEMP compounders rebuild (parent share)
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths: ['.github/workflows/tmp-compounders-rebuild.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the build's tests first
        run: |
          python tests/test_compounders_series.py
          python tests/test_compounders_score.py
          python tests/test_compounders_market.py
      - name: Run compounders refresh
        run: python scripts/refresh_compounders.py
      - name: Commit to the branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/compounders.json
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: rebuild compounders (parent-share attribution) on the branch"
          for attempt in 1 2 3 4; do
            git pull --rebase origin claude/legal-rep-invoice-tracking-9j1i9r && git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && exit 0
            sleep $((attempt * 5))
          done
          exit 1
