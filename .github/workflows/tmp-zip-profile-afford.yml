# TEMPORARY: one real build of the affordability baseline on the branch (run 2). Deleted before the PR.
# Builds market-pulse-v21/data/zip_profile.db and data/zip_series.db —
# the dataset behind the rebuilt map and ZIP page (scripts/build_zip_profile.py).
# Runs on the 3rd, after refresh-national-zips (1st) and refresh-rents (2nd),
# because it carries HUD bedroom rents from zips.db rather than calling HUD.
name: TEMP zip profile build (affordability baseline, branch run)

on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths: ['.github/workflows/tmp-zip-profile-afford.yml']

permissions:
  contents: write

concurrency:
  group: zip-profile-tmp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Prove the parsers and the underwriting before spending any downloads
        run: |
          python tests/test_acs_bulk.py
          python tests/test_zip_profile.py
          python tests/test_zip_market.py
          python tests/test_zip_page.py
          python tests/test_underwrite.py
          python tests/test_affordability_inputs.py

      # FRED supplies the affordability baseline's CPI and mortgage-rate
      # averages (keyless CSV if the key is absent); Census 2015-2019 income
      # comes from the API, keyless at this volume, keyed if the secret exists.
      - name: Build the ZIP profile
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python scripts/build_zip_profile.py

      - name: Commit + push if changed
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/zip_profile.db market-pulse-v21/data/zip_series.db
          if git diff --staged --quiet; then
            echo "No change to the ZIP profile — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh ZIP profile

          Auto-generated by .github/workflows/refresh-zip-profile.yml.
          Source vintages are in the database's meta table."
          for attempt in 1 2 3 4; do
            if git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r; then
              break
            fi
            echo "Push attempt $attempt failed — pulling rebase and retrying."
            sleep $((attempt * 5))
            git pull --rebase origin claude/legal-rep-invoice-tracking-9j1i9r || true
          done
