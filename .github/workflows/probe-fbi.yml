name: TEMPORARY — find the FBI city crime source

# Discovers where the FBI Crime Data Explorer keeps its downloadable files
# and whether GitHub's runners can reach them without a key. Read-only.
# Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-fbi.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Round 3 — full shape, naming, national count, speed
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request, urllib.error, collections
          from concurrent.futures import ThreadPoolExecutor
          B = "https://cde.ucr.cjis.gov/LATEST"
          UA = {"User-Agent": "Mozilla/5.0 (market-pulse research)"}
          def get(path):
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(B + path, headers=UA), timeout=90) as r:
                      return r.status, json.loads(r.read()), time.time() - t
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:200], time.time() - t
              except Exception as e:
                  return None, repr(e), time.time() - t
          # full response shape, 36 months, Akron + a tiny village
          st, d, dt = get("/summarized/agency/OH0770100/violent-crime?from=01-2023&to=12-2025")
          print("AKRON 36mo:", st, f"{dt:.2f}s")
          def shape(o, depth=0):
              if isinstance(o, dict):
                  for k, v in list(o.items())[:12]:
                      if isinstance(v, dict) and v and all(re.match(r"\d\d-\d{4}$", kk) for kk in v):
                          vals = list(v.values())
                          print("  " * depth + f"{k}: {len(v)} months, first {list(v.items())[:2]}, last {list(v.items())[-2:]}, nulls {sum(x is None for x in vals)}")
                      else:
                          print("  " * depth + f"{k}:" + ("" if isinstance(v, (dict, list)) else f" {v!r}"[:120]))
                          shape(v, depth + 1)
              elif isinstance(o, list):
                  print("  " * depth + f"[list of {len(o)}] {json.dumps(o[:2])[:200]}")
          shape(d)
          st, ags, _ = get("/agency/byStateAbbr/OH")
          city = [a for v in ags.values() for a in v if a.get("agency_type_name") == "City"]
          suffix = collections.Counter(re.sub(r"^.*?((Police|Village|City|Town|Township|Marshal|Public Safety|Division|Department|Dept|Sheriff).*)$", r"\1", a["agency_name"]) for a in city)
          print("OH city-agency name endings:", suffix.most_common(25))
          print("sample names:", [a["agency_name"] for a in city[::60]])
          tiny = next(a for a in city if "Kelleys Island" in a["agency_name"])
          for off in ("violent-crime", "property-crime"):
              st, d2, dt = get(f"/summarized/agency/{tiny['ori']}/{off}?from=01-2023&to=12-2025")
              print("TINY", tiny["agency_name"], off, st, f"{dt:.2f}s"); shape(d2)
          # speed: 12 sequential, then 24 across 6 threads
          oris = [a["ori"] for a in city[:36]]
          t = time.time(); sts = [get(f"/summarized/agency/{o}/violent-crime?from=01-2025&to=12-2025")[0] for o in oris[:12]]
          print(f"12 sequential: {time.time()-t:.1f}s statuses {collections.Counter(sts)}")
          t = time.time()
          with ThreadPoolExecutor(6) as ex:
              sts = list(ex.map(lambda o: get(f"/summarized/agency/{o}/violent-crime?from=01-2025&to=12-2025")[0], oris[12:36]))
          print(f"24 over 6 threads: {time.time()-t:.1f}s statuses {collections.Counter(sts)}")
          # national count of city agencies
          states = ["AL","AK","AZ","AR","CA","CO","CT","DE","DC","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"]
          tot = collections.Counter()
          for s_ in states:
              st, a2, _ = get(f"/agency/byStateAbbr/{s_}")
              if st != 200:
                  print("  agency list failed", s_, st); continue
              for v in a2.values():
                  for a in v:
                      tot[a.get("agency_type_name")] += 1
          print("NATIONAL agency types:", tot.most_common())
          PY
