name: TEMPORARY — FBI city crime pull (timed Ohio test)

# Runs the real fetch on the working branch and commits the raw per-agency
# file there, so the trust rules can be built and tuned against real data
# before merge. Deleted before the branch merges; the permanent job is
# refresh-crime.yml.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-fbi.yml'

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove the parsers
        run: python tests/test_crime_build.py
      - name: Fetch Ohio only, timed, with progress
        run: python -u scripts/fetch_fbi_crime.py --end-year 2025 --states OH
      - name: What came back
        run: |
          python - <<'PY'
          import json, collections
          d = json.load(open("data/headroom/fbi_agencies.json"))
          ags = d["agencies"]
          print(len(ags), "agencies;", d["_meta"]["failed_requests"], "failed")
          m = collections.Counter(tuple(a["v"][y]["m"] for y in ("2023", "2024", "2025")) if a.get("v") else None for a in ags)
          print("violent months reported (2023, 2024, 2025):", m.most_common(8))
          for a in ags:
              if a["name"].split(" Police")[0] in ("Akron", "Cleveland", "Columbus", "Toledo", "Dayton", "Cincinnati", "Dublin", "Westerville"):
                  print(" ", a["name"], {y: (a["v"][y], a["p"][y]) for y in ("2024", "2025")} if a.get("v") else None)
          PY
