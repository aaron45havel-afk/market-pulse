name: TEMPORARY — first national FBI city crime pull

# Runs the real fetch on the working branch and commits the raw per-agency
# file there, so the trust rules can be built and tuned against real data
# before merge. Deleted before the branch merges; the permanent job is
# refresh-crime.yml.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-fbi.yml'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove the parsers
        run: python tests/test_crime_build.py
      - name: Fetch every city agency, 2023–2025
        run: python scripts/fetch_fbi_crime.py --end-year 2025
      - name: Commit the raw pull to the working branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/headroom/fbi_agencies.json
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: first national FBI city crime pull (raw, 2023-2025)"
          for i in 1 2 3 4; do git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && exit 0; sleep $((i * 5)); git pull --rebase origin claude/legal-rep-invoice-tracking-9j1i9r || true; done
          exit 1
