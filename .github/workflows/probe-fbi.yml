name: TEMPORARY — find the FBI city crime source

# Discovers where the FBI Crime Data Explorer keeps its downloadable files
# and whether GitHub's runners can reach them without a key. Read-only.
# Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-fbi.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reachability and the download keys the CDE web app knows about
        run: |
          python3 - <<'PY'
          import re, json, urllib.request, urllib.error
          UA = {"User-Agent": "Mozilla/5.0 (market-pulse research)"}
          def get(url, n=None):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                      b = r.read() if n is None else r.read(n)
                      return r.status, r.headers.get("content-type"), b
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("content-type"), e.read()[:300]
              except Exception as e:
                  return None, None, repr(e).encode()
          for u in ("https://cde.ucr.cjis.gov/LATEST/webapp/",
                    "https://api.usa.gov/crime/fbi/cde/agency/byStateAbbr/OH?API_KEY=DEMO_KEY",
                    "https://ucr.fbi.gov/crime-in-the-u.s/2019/crime-in-the-u.s.-2019/tables/table-8/table-8.xls/view"):
              st, ct, b = get(u)
              print(f"== {u}\n   HTTP {st} {ct} {len(b)} bytes: {b[:300]!r}")
          st, ct, html = get("https://cde.ucr.cjis.gov/LATEST/webapp/")
          html = html.decode("utf-8", "replace")
          srcs = re.findall(r'src="([^"]+\.js)"', html)
          print("scripts:", srcs)
          keys = set()
          for s in srcs:
              st, ct, js = get("https://cde.ucr.cjis.gov/LATEST/webapp/" + s)
              js = js.decode("utf-8", "replace")
              print(f"  {s}: HTTP {st}, {len(js)} chars")
              for m in re.finditer(r'signedurl[^"\'`]{0,80}', js):
                  keys.add("SIGNED: " + m.group(0))
              for m in re.finditer(r'["\'`]([\w\-./]*?(?:cius|table|return|offense|additional|nibrs|summar|download)[\w\-./]*?\.(?:zip|xlsx|xls|csv))["\'`]', js, re.I):
                  keys.add(m.group(1))
              for m in re.finditer(r'["\'`](/?LATEST/[\w\-./]+)["\'`]', js):
                  keys.add(m.group(1))
          for k in sorted(keys)[:200]:
              print("   ", k)
          PY
