# TEMPORARY: run the real quiet-value refresh on this branch with the fixed user agent. Deleted before the PR.
name: TEMP quiet-value refresh (branch)
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths: ['.github/workflows/tmp-quiet-value-run.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime deps
        run: pip install -r requirements.txt
      - name: Verify the screen's maths first
        run: |
          python tests/test_liquidity.py
          python tests/test_pricefeed.py
      - name: Build the quiet-value screen
        run: python scripts/refresh_quiet_value.py --limit 400
      - name: Commit to the branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/quiet_value.json
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: quiet-value screen refresh on the branch (fixed price feed)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin claude/legal-rep-invoice-tracking-9j1i9r && git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && exit 0
            sleep $((attempt * 5))
          done
          exit 1
