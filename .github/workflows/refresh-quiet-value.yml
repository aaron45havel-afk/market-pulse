name: Refresh quiet-value screen

# Low-turnover small caps crossed with a balance-sheet + valuation test.
#
# This runs in CI rather than the app because it needs a YEAR of daily
# volume per candidate on top of EDGAR frames and a price — thousands of
# calls. It is also the only place it CAN run: sec.gov, Yahoo and
# Finnhub are all unreachable from the dev sandbox, so the maths lives in
# liquidity.py / quality_value.py where it is unit-testable offline and
# this job is only the plumbing.
#
# Weekly. Turnover is a trailing-12-month figure — it does not move
# enough day to day to justify hammering the feeds, and the research it
# implements rebalances annually.

on:
  schedule:
    - cron: '0 13 * * 6'   # Saturdays 13:00 UTC — markets shut, feeds quiet
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max candidates to pull volume history for'
        required: false
        default: '600'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Verify the screen's maths before spending any API calls
        run: python tests/test_liquidity.py

      - name: Build the quiet-value screen
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/refresh_quiet_value.py --limit "${{ github.event.inputs.limit || '600' }}"

      - name: Commit + push if changed
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/quiet_value.json
          if git diff --staged --quiet -- market-pulse-v21/data/quiet_value.json; then
            echo "No change to quiet_value.json — nothing to commit."
            exit 0
          fi
          git commit -m "chore: weekly quiet-value screen refresh

          Auto-generated by .github/workflows/refresh-quiet-value.yml.
          Turnover from Yahoo daily volume; fundamentals from SEC EDGAR XBRL frames."
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then break; fi
            echo "Push attempt $attempt failed — rebasing and retrying."
            sleep $((attempt * 5))
            git pull --rebase origin main || true
          done
          git push origin HEAD:main
