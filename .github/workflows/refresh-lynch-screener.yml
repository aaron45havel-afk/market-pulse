name: Refresh Lynch GARP screener snapshot

# Monthly snapshot of the Peter Lynch GARP screener. Thresholds live in
# lynch.py, are re-exported into the snapshot's _meta.rules, and the page
# templates its own copy from that payload — so this comment is the only
# place a stale number can hide, and it deliberately names none.
#
# PRICES COME FROM ONE BULK MARKET FILE, not a request per ticker. The old
# path was ~90 minutes of Finnhub calls or a Yahoo retry ladder that
# returns zero rows from Actions IP ranges, with no timeout set — it died
# at GitHub's six-hour ceiling with no snapshot and no signal.
# Commits to data/lynch_snapshots/YYYY-MM.json; the /lynch UI loads the
# latest and lets you browse history via a month dropdown.
#
# Runs an hour after the net-net screener so the SEC API isn't taking
# two hits at once.

on:
  schedule:
    - cron: '0 11 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The old job set none, so a hung fetch burned six hours.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: pip install -r requirements.txt

      # Before any network call. Every defect this screen shipped for three
      # months was a pure function over a facts dict, reachable by a
      # fixture in under a second — and the committed snapshot WAS the
      # fixture. A parser regression now fails here in seconds instead of
      # after an hour of downloads and a published board.
      - name: Verify the arithmetic before spending any API calls
        run: |
          python tests/test_lynch.py
          python tests/test_pricefeed.py
          python tests/test_schloss.py

      - name: Snapshot the Lynch screener
        run: python scripts/refresh_lynch_screener.py

      - name: Commit + push if changed
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/lynch_snapshots
          if git diff --staged --quiet -- market-pulse-v21/data/lynch_snapshots; then
            echo "No change to lynch_snapshots — nothing to commit."
            exit 0
          fi
          git commit -m "chore: monthly Lynch GARP screener snapshot

          Auto-generated by .github/workflows/refresh-lynch-screener.yml.
          Source: SEC EDGAR XBRL + Stooq daily close."
          # Push with rebase-on-conflict so racing commits (other monthly
          # jobs landing during our long run) don't blow up the auto-commit.
          # Retry up to 4 times with a brief sleep before each rebase.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push attempt $attempt failed — pulling rebase and retrying."
            sleep $((attempt * 5))
            git pull --rebase origin main || true
          done
          # Final attempt — if it still fails the workflow exits non-zero.
          git push origin HEAD:main
