name: Refresh Compounders screen (monthly)

# Rebuilds data/compounders.json for /compounders — the 14%/yr screen.
# Universe self-discovers from SEC EDGAR revenue frames, then 10 years of
# XBRL fundamentals per company + Yahoo prices/dividends.
#
# THE REVENUE FLOOR IS THE UNIVERSE SIZE DIAL. At $1B it admitted 1,582
# names and scored 901. It is exposed as an input here so the universe can
# be widened or narrowed without a commit.
#
# Cadence: 5th of each month at 09:00 UTC (after most 10-K/Q waves
# settle, before the other monthly jobs' window).

on:
  schedule:
    - cron: '0 9 5 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Process only the N largest companies (testing)'
        required: false
        default: ''
      min_revenue:
        description: 'Revenue floor in dollars (default 250000000 = $250M)'
        required: false
        default: ''
      max_universe:
        description: 'Hard cap on CIKs processed (default 6000)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Runs before any network call. Both bugs this guards against were
      # invisible in the output — they produced numbers, just wrong ones —
      # and survived because nothing here was tested.
      - name: Verify XBRL series extraction before spending any API calls
        run: python tests/test_compounders_series.py

      - name: Run compounders refresh
        run: |
          set -euo pipefail
          # Plain `[ -n "$x" ] && ARGS=...` returns 1 when the input is
          # empty, and under `set -e` that ends the job before it starts.
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ -n "${{ inputs.min_revenue }}" ]; then
            ARGS="$ARGS --min-revenue ${{ inputs.min_revenue }}"
          fi
          if [ -n "${{ inputs.max_universe }}" ]; then
            ARGS="$ARGS --max-universe ${{ inputs.max_universe }}"
          fi
          echo "Running with:${ARGS:- built-in defaults}"
          python scripts/refresh_compounders.py $ARGS

      - name: Commit + push if changed
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/compounders.json
          if git diff --staged --quiet -- market-pulse-v21/data/compounders.json; then
            echo "No change to compounders.json — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh compounders screen data

          Auto-generated by .github/workflows/refresh-compounders.yml.
          SEC EDGAR XBRL (10y fundamentals) + Yahoo (prices/dividends)."
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push attempt $attempt failed — pulling rebase and retrying."
            sleep $((attempt * 5))
            git pull --rebase origin main || true
          done
          git push origin HEAD:main
