name: TEMPORARY — first HUD rent run on the working branch

# Runs the rent refresh with HUD on the working branch and commits zips.db
# there, so the page can be checked against real HUD rents before merge.
# Deleted before the branch merges; the permanent job is refresh-rents.yml.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-hud.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Token present?
        env:
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: |
          if [ -n "$HUD_API_TOKEN" ]; then echo "HUD_API_TOKEN is set (${#HUD_API_TOKEN} chars)"; else echo "::error::HUD_API_TOKEN is empty"; exit 1; fi
      - name: Prove the rules before an hour of HUD requests
        run: |
          python tests/test_rent_ladder.py
          python tests/test_rents_build.py
      - name: The real script, the states the first run mismatched on spelling
        env:
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: python scripts/refresh_rents.py --states AL,AR,FL,IA,IL,IN,LA,MD,MI,MN,MO,NY,TX,WI
      - name: How HUD's 2-bedroom compares with Zillow where both exist
        run: |
          python - <<'PY'
          import sqlite3, statistics as S
          c = sqlite3.connect("data/zips.db")
          print(c.execute("select rent_tier, count(*) from zips group by 1 order by 2 desc").fetchall())
          for col in ("rent_safmr", "rent_fmr"):
              pairs = c.execute(f"select {col}*1.0/rent_zori from zips where {col} and rent_zori").fetchall()
              r = sorted(p[0] for p in pairs)
              if r:
                  q = lambda f: round(r[int(f * (len(r) - 1))], 3)
                  print(f"{col}/zori over {len(r)} ZIPs: p10 {q(.1)} p25 {q(.25)} median {q(.5)} p75 {q(.75)} p90 {q(.9)}")
          for st in ("OH", "IN", "TX", "FL", "CA"):
              print(st, c.execute("select count(*), sum(median_rent_monthly is null), sum(rent_tier='zori'), sum(rent_tier='safmr'), sum(rent_tier='fmr') from zips where state=?", (st,)).fetchone())
          PY
      - name: Commit zips.db to the working branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/zips.db
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: rent ladder — re-pull the states with Saint/St. county names"
          for i in 1 2 3 4; do git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && exit 0; sleep $((i * 5)); git pull --rebase origin claude/legal-rep-invoice-tracking-9j1i9r || true; done
          exit 1
