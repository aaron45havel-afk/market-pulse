name: Refresh catalyst queue

# Scans the EDGAR daily index for the filings that are actually
# catalysts — tender offers, going-private, activist stakes, spin-offs,
# liquidations — plus the warnings you want fast if you hold the name
# (going dark, auditor change, late filing).
#
# Twice on weekdays, not continuously. For these situations the window is
# days to weeks; hours of latency cost nothing, and a live feed would only
# encourage the churn that eats the after-tax return.

on:
  schedule:
    - cron: '0 13 * * 1-5'   # ~9am ET
    - cron: '0 23 * * 1-5'   # after the close, catching the day's filings
  workflow_dispatch:
    inputs:
      days:
        description: 'Trailing days of index to scan'
        required: false
        default: '4'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The index scan is a handful of requests. The Form 4 pass is ~1,200
    # documents at 8/second — a few minutes, and the reason the queue can
    # tell a purchase from a vesting event at all.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: pip install -r requirements.txt

      # The classification and scoring are what make the queue worth
      # reading, and sec.gov is unreachable from the dev sandbox — so they
      # are proved here, before any fetch, every run.
      - name: Verify classification + triage
        run: python tests/test_catalysts.py

      # Two stages. The index says WHICH filings exist; the second pass
      # opens every Form 4, because the index cannot tell a purchase from
      # a grant and 97% of its Form 4 hits are not purchases.
      - name: Scan the EDGAR daily index, then read the Form 4s
        run: python scripts/refresh_catalysts.py --days "${{ github.event.inputs.days || '4' }}"

      - name: Commit + push if changed
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/catalysts.json
          if git diff --staged --quiet -- market-pulse-v21/data/catalysts.json; then
            echo "No new catalyst filings — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh catalyst queue from EDGAR daily index

          Auto-generated by .github/workflows/refresh-catalysts.yml."
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then break; fi
            echo "Push attempt $attempt failed — rebasing and retrying."
            sleep $((attempt * 5))
            git pull --rebase origin main || true
          done
          git push origin HEAD:main
