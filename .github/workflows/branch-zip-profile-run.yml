# TEMPORARY — phase 2: builds the ZIP profile with market activity on this
# branch from live sources. Deleted before merge.
name: Branch run (ZIP profile + market)

on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths: ['.github/workflows/branch-zip-profile-run.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python tests/test_acs_bulk.py
          python tests/test_zip_profile.py
          python tests/test_zip_market.py
          python tests/test_underwrite.py
      - name: Build the ZIP profile
        run: python scripts/build_zip_profile.py
      - name: Report the market columns
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/zip_profile.db")
          m = dict(c.execute("select key, value from meta").fetchall())
          print({k: m[k] for k in m if k.startswith(("rdc", "redfin", "market", "coverage"))})
          print(c.execute("select count(rdc_month), sum(rdc_thin=0), count(cty_rdc_month), count(rf_period_end), sum(rf_thin=0) from zip_profile").fetchall())
          for z in ("94105", "28625", "89178", "77449", "10009"):
              print(c.execute("select zip, rdc_month, rdc_active, rdc_dom, rdc_price_cut_pct, rdc_pending_ratio, rdc_list_price, cty_rdc_dom, rf_period_end, rf_sale_price, rf_sale_to_list_pct, rf_homes_sold from zip_profile where zip=?", (z,)).fetchall())
          PY
      - name: Commit to the branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/zip_profile.db market-pulse-v21/data/zip_series.json.gz
          git diff --staged --quiet && exit 0
          git commit -m "chore: ZIP profile with market activity (branch data run)"
          for attempt in 1 2 3 4; do
            git pull --rebase -X theirs origin claude/legal-rep-invoice-tracking-9j1i9r && \
              git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && break
            sleep $((attempt * 5))
          done
