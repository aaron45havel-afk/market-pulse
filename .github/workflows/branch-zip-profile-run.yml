# TEMPORARY — builds the ZIP profile on this branch from live sources and
# probes Redfin's ZIP-level market tracker for phase 2. Deleted before merge.
# Run 3: top-coded taxes estimated from the county median, floored at the $10,000 bound.
# (The Redfin probe ran in runs 1-2: 1.55 GB, 9.7M rows, streams in 82 s, latest 2026-05-31.)
name: Branch run (ZIP profile + Redfin probe)

on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths: ['.github/workflows/branch-zip-profile-run.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: pip install -r requirements.txt
      - run: |
          python tests/test_acs_bulk.py
          python tests/test_zip_profile.py
          python tests/test_underwrite.py
      - name: Build the ZIP profile
        run: python scripts/build_zip_profile.py
      - name: Report what was built
        run: |
          python - <<'PY'
          import sqlite3, json
          c = sqlite3.connect("data/zip_profile.db")
          print(dict(c.execute("select key, value from meta").fetchall()))
          for q in ("select state, count(*) from zip_profile group by state order by 2 desc limit 5",
                    "select count(*), sum(zhvi is null), sum(acs_flags is not null), sum(tax_rate_acs is null) from zip_profile",
                    "select zip, zhvi, zhvi_month, zori, tax_rate_acs, tax_rate_investor, tax_rate_owner, acs_median_income, acs_flags from zip_profile where zip in ('94105','20854','75201','10009','33139')"):
              print(q[:60], c.execute(q).fetchall())
          PY
          ls -la data/zip_profile.db data/zip_series.json.gz
      - name: Commit to the branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/zip_profile.db market-pulse-v21/data/zip_series.json.gz
          git diff --staged --quiet && exit 0
          git commit -m "chore: ZIP profile (branch data run)"
          for attempt in 1 2 3 4; do
            git pull --rebase -X theirs origin claude/legal-rep-invoice-tracking-9j1i9r && \
              git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && break
            sleep $((attempt * 5))
          done

