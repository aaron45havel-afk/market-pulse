# TEMPORARY: probe SEC filings for HOLT finding #4 (share classes / noncontrolling interests). Deleted before the PR.
name: TEMP HOLT NCI probe
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths: ['.github/workflows/tmp-holt-nci-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Probe
        working-directory: market-pulse-v21
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request, gzip, sys
          sys.path.insert(0, ".")
          UA = {"User-Agent": "market-pulse-research admin@focusedops.io", "Accept-Encoding": "gzip"}
          def get(url):
              for i in range(4):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60)
                      b = r.read()
                      if r.headers.get("Content-Encoding") == "gzip": b = gzip.decompress(b)
                      time.sleep(0.15)
                      return json.loads(b)
                  except Exception as e:
                      err = e; time.sleep(2 * (i + 1))
              print("FAIL", url, err); return None
          def annual(facts, ns, tag):
              u = ((facts.get("facts") or {}).get(ns) or {}).get(tag)
              if not u: return {}
              out = {}
              for unit, vals in u["units"].items():
                  for v in vals:
                      if v.get("form") in ("10-K", "20-F", "40-F") and v.get("fp") == "FY" and v.get("fy"):
                          out[v["fy"]] = (v["val"], unit, v.get("end"))
              return out
          TAGS = [("us-gaap","WeightedAverageNumberOfDilutedSharesOutstanding"),("us-gaap","WeightedAverageNumberOfSharesOutstandingBasic"),
                  ("dei","EntityCommonStockSharesOutstanding"),("us-gaap","NetIncomeLoss"),("us-gaap","ProfitLoss"),
                  ("us-gaap","NetIncomeLossAttributableToNoncontrollingInterest"),("us-gaap","MinorityInterest"),
                  ("us-gaap","NetCashProvidedByUsedInOperatingActivities"),("us-gaap","PaymentsToAcquirePropertyPlantAndEquipment"),
                  ("ifrs-full","WeightedAverageShares"),("ifrs-full","ProfitLoss"),("ifrs-full","ProfitLossAttributableToOwnersOfParent"),
                  ("ifrs-full","ProfitLossAttributableToNoncontrollingInterests"),("ifrs-full","NoncontrollingInterests"),
                  ("ifrs-full","CashFlowsFromUsedInOperatingActivities")]
          for name, cik in (("HESM", 1789832), ("FORTY", 1045986)):
              f = get(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json")
              s = get(f"https://data.sec.gov/submissions/CIK{cik:010d}.json")
              print(f"\n===== {name} {f and f.get('entityName')} tickers={s and s.get('tickers')} sic={s and s.get('sic')} {s and s.get('sicDescription')}")
              if not f: continue
              for ns, tag in TAGS:
                  a = annual(f, ns, tag)
                  if a: print(f"{ns}:{tag}: " + "; ".join(f"{y}={v[0]:,.0f}{'' if v[1] in ('USD','shares') else ' '+v[1]}" for y, v in sorted(a.items())[-8:]))
              # dei share counts by class are in the filing's cover; companyfacts drops dimensions — print every dei shares fact for the last 2 years
              d = ((f.get("facts") or {}).get("dei") or {}).get("EntityCommonStockSharesOutstanding")
              if d:
                  for unit, vals in d["units"].items():
                      print("dei shares (all):", [(v.get("end"), v["val"], v.get("form")) for v in vals][-8:])
          # ── universe: how much profit belongs to noncontrolling holders ──
          comp = json.load(open("data/compounders.json"))
          tick = {t: m for t, m in comp["tickers"].items() if isinstance(m, dict) and m.get("cik")}
          by_cik = {int(m["cik"]): t for t, m in tick.items()}
          def frame(ns, tag, cy):
              j = get(f"https://data.sec.gov/api/xbrl/frames/{ns}/{tag}/USD/{cy}.json")
              return {int(r["cik"]): r["val"] for r in (j or {}).get("data", [])}
          res = {}
          for cy in ("CY2025", "CY2024"):
              nci = frame("us-gaap", "NetIncomeLossAttributableToNoncontrollingInterest", cy)
              pl = frame("us-gaap", "ProfitLoss", cy)
              ni = frame("us-gaap", "NetIncomeLoss", cy)
              inci = frame("ifrs-full", "ProfitLossAttributableToNoncontrollingInterests", cy)
              ipl = frame("ifrs-full", "ProfitLoss", cy)
              print(f"\n{cy}: frames sizes nci={len(nci)} pl={len(pl)} ni={len(ni)} ifrs_nci={len(inci)} ifrs_pl={len(ipl)}")
              for cik, t in by_cik.items():
                  if t in res: continue
                  n = nci.get(cik, inci.get(cik)); p = pl.get(cik, ipl.get(cik))
                  if p is None and n is not None and cik in ni: p = ni[cik] + n
                  if n is not None and p:
                      res[t] = (cy, n, p, n / p)
          share = sorted(((abs(v[3]), t, v) for t, v in res.items()), reverse=True)
          print(f"\nuniverse {len(tick)}; with NCI+profit measured: {len(res)}")
          for cut in (0.05, 0.10, 0.25, 0.50):
              print(f"  NCI share of profit > {cut:.0%}: {sum(1 for s, _, _ in share if s > cut)}")
          import holt as H
          rows = [{**m, "ticker": t} for t, m in comp["tickers"].items() if isinstance(m, dict)]
          clean = {s["ticker"] for s in H.rank(rows)["clean"]}
          print("\nHOLT clean rows with NCI share > 10%:")
          for s, t, v in share:
              if t in clean and s > 0.10:
                  m = comp["tickers"][t]
                  print(f"  {t:6} {m.get('name','')[:32]:32} {v[0]} nci {v[1]:,.0f} of profit {v[2]:,.0f} = {v[3]:.0%}  pfcf_now {m.get('pfcf_now')} med {m.get('pfcf_med')} minority_bs {m.get('minority')}")
          print("\nTop 25 by NCI share (any board):")
          for s, t, v in share[:25]:
              m = comp["tickers"][t]
              print(f"  {t:6} {m.get('name','')[:32]:32} {v[3]:.0%} pfcf_now {m.get('pfcf_now')} med {m.get('pfcf_med')}")
          PY
