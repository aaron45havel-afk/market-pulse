name: TEMPORARY probe — climate + hazard source formats

# Runs only on the working branch, only when the probe itself changes, and is
# deleted before the branch merges. It fetches nothing into the repo.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-climate-hazards.yml'
      - 'market-pulse-v21/scripts/probe_climate_hazards.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        working-directory: market-pulse-v21
        run: python scripts/probe_climate_hazards.py
