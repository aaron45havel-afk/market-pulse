# TEMPORARY — rebuilds the Lynch and 100-bagger snapshots on this branch
# after the #5 rule changes (second run: tighter Lynch growth guards).
# Deleted before the PR merges.
name: Branch rebuild (owner design calls)

on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths: ['.github/workflows/branch-rebuild-owner-calls.yml']

permissions:
  contents: write

jobs:
  rebuild:
    strategy:
      fail-fast: false
      matrix:
        board:
          - { name: lynch, script: refresh_lynch_screener.py, dir: lynch_snapshots }
          - { name: hundred, script: refresh_hundred.py, dir: hundred_snapshots }
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Tests first
        run: |
          python tests/test_checklist.py
          python tests/test_lynch.py
          python tests/test_hundred_build.py
      - name: Rebuild ${{ matrix.board.name }}
        run: python scripts/${{ matrix.board.script }} --force
      - name: Commit to the branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/${{ matrix.board.dir }}
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: ${{ matrix.board.name }} snapshot rebuild (branch data run)"
          for attempt in 1 2 3 4; do
            git pull --rebase -X theirs origin claude/legal-rep-invoice-tracking-9j1i9r && \
              git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && break
            sleep $((attempt * 5))
          done
