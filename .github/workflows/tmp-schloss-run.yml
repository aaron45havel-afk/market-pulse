# TEMPORARY: run the real Schloss refresh on this branch (phase 1 fixes). Deleted before the PR.
name: TEMP Schloss refresh (branch)
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths: ['.github/workflows/tmp-schloss-run.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify domain + parsers first
        run: |
          python tests/test_schloss.py
          python tests/test_schloss_build.py
          python tests/test_pricefeed.py
      - name: Run Schloss refresh
        run: python scripts/refresh_schloss.py
      - name: Commit the board to the branch (not the snapshot; the Oct 7 run writes October's)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/schloss.json
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: Schloss screen refresh on the branch (phase 1 fixes)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin claude/legal-rep-invoice-tracking-9j1i9r && git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && exit 0
            sleep $((attempt * 5))
          done
          exit 1
