name: Refresh Schloss screen (monthly)

# Rebuilds data/schloss.json for /schloss — Walter Schloss's method, run
# off SEC filings alone.
#
# THIS JOB IS CHEAP AND WIDE, WHICH IS THE OPPOSITE OF refresh-compounders.
# Compounders asks companyfacts once per company (~6,000 requests) because
# it needs fifteen years of six series each, and reaches ~1,900 names.
# Schloss needs one balance sheet and a short dividend series, which the
# frames API returns for EVERY FILER IN ONE CALL PER CONCEPT — about 160
# requests for roughly 7,000 companies, including the small end of the
# market where Schloss actually worked.
#
# EVERYTHING HERE IS FREE, INCLUDING THE VALUATION. The cheapness half
# used to report UNKNOWN because free quotes looked impossible — but that
# conclusion came from asking one endpoint PER COMPANY (~2,000 Yahoo calls
# for compounders, 5,673 here) and getting rate-limited. Rate limits count
# requests, not rows, and the real requirement is 5,673 numbers once a
# month. A bulk market file answers all of it in ONE request.
#
# Market cap is taken in preference to price, because market cap over
# tangible book needs no share count — a figure missing for 962 of 5,673
# companies here — and because it catches the balance sheets denominated
# in a currency the SEC frame mislabelled as dollars.
#
# Cadence: 7th of each month at 08:00 UTC — after 10-K/Q waves settle and
# clear of the other monthly jobs' windows.

on:
  schedule:
    - cron: '0 8 7 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Score only the first N companies (testing)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Runs before any network call. Both suites are pure — no fixtures
      # are fetched — so a parser regression fails here in seconds rather
      # than after twenty minutes of downloads.
      - name: Verify domain + parsers before spending any API calls
        run: |
          python tests/test_schloss.py
          python tests/test_schloss_build.py
          python tests/test_pricefeed.py

      - name: Run Schloss refresh
        run: |
          set -euo pipefail
          # Plain `[ -n "$x" ] && ARGS=...` returns 1 when the input is
          # empty, and under `set -e` that ends the job before it starts.
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          echo "Running with:${ARGS:- built-in defaults}"
          python scripts/refresh_schloss.py $ARGS

      - name: Commit + push if changed
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Two paths, not one. schloss.json is the live board and is
          # overwritten every run; data/schloss_snapshots/YYYY-MM.json is
          # a NEW file each month that is never rewritten afterwards. Miss
          # the second path and the snapshot is built inside the runner
          # and thrown away with it — the point-in-time record that makes
          # a Riklis/net-net cutoff testable would silently never exist.
          # -A so the 36-month prune's deletions are staged too.
          PATHS="market-pulse-v21/data/schloss.json market-pulse-v21/data/schloss_snapshots"
          # `git add` on a path that does not exist is FATAL, not a no-op,
          # and this step runs under `set -e` after twenty minutes of
          # fetching. The refresh skips the snapshot on --limit runs, so
          # on a first-ever `--limit` test the directory is absent and the
          # whole job would die here with schloss.json uncommitted. An
          # existing-but-empty directory adds cleanly.
          mkdir -p market-pulse-v21/data/schloss_snapshots
          git add -A $PATHS
          if git diff --staged --quiet -- $PATHS; then
            echo "No change to the board or the snapshots — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh Schloss screen data

          Auto-generated by .github/workflows/refresh-schloss.yml.
          SEC EDGAR XBRL frames (balance sheet + dividends) and the
          quarterly filing index (survival). No market data feed.
          Also lays down this month's point-in-time snapshot under
          data/schloss_snapshots/."
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push attempt $attempt failed — pulling rebase and retrying."
            sleep $((attempt * 5))
            git pull --rebase origin main || true
          done
          git push origin HEAD:main
