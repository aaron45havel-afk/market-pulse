name: TEMPORARY — find the Connecticut crosswalk

# Checks whether HUD's other New England states are listed by town, whether
# towns in one county get different rents, and what HUD's ZIP-to-town
# crosswalk and the Census 2020 relationship files offer. Read-only.
# Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-ct.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: New England HUD areas, HUD ZIP-town crosswalk, Census listings
        env:
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: |
          python3 -u - <<'PY'
          import collections, json, os, re, time, urllib.request, urllib.error
          UA = {"User-Agent": "MarketPulse/1.0 (ct probe)"}
          tok = os.environ.get("HUD_API_TOKEN", "")
          HDR = {"Authorization": "Bearer " + tok}
          def get(url, headers=None):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={**UA, **(headers or {})}), timeout=120) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:300]
          H = "https://www.huduser.gov/hudapi/public"

          for d in ("https://www2.census.gov/geo/docs/maps-data/data/rel2020/",
                    "https://www2.census.gov/geo/docs/maps-data/data/rel2020/zcta520/",
                    "https://www2.census.gov/geo/docs/maps-data/data/rel2020/cousub/"):
              st, b = get(d)
              names = re.findall(r'href="([^"?/][^"]*)"', b.decode("utf-8", "replace")) if st == 200 else []
              print(f"== {d}: {st}", [n for n in names if not n.startswith("http")][:40])

          for stt in ("MA", "ME", "NH", "RI", "VT", "NY"):
              st, b = get(f"{H}/fmr/listCounties/{stt}", HDR)
              rows = json.loads(b) if st == 200 else []
              towns = [r for r in rows if r.get("town_name")]
              print(f"== listCounties/{stt}: {st}, {len(rows)} entries, {len(towns)} with a town,",
                    "code lengths", dict(collections.Counter(len(str(r.get('fips_code'))) for r in rows)),
                    rows[:2])
              if stt in ("MA", "ME") and towns:
                  by_cty = collections.defaultdict(list)
                  for r in towns:
                      by_cty[r["county_name"]].append(r)
                  for cty in sorted(by_cty, key=lambda c: -len(by_cty[c]))[:2]:
                      ts = by_cty[cty]
                      pick = ts[:: max(1, len(ts) // 6)][:6]
                      for r in pick:
                          st2, b2 = get(f"{H}/fmr/data/{r['fips_code']}", HDR)
                          try:
                              d = json.loads(b2)["data"]
                              bd = d["basicdata"]
                              two = (bd if isinstance(bd, dict) else next(x for x in bd if x.get("zip_code") == "MSA level")).get("Two-Bedroom")
                              print(f"    {cty} / {r['town_name']}: {st2} {d.get('area_name')} small={d.get('smallarea_status')} 2BR={two} zips={len(bd) - 1 if isinstance(bd, list) else 0}")
                          except Exception as e:
                              print(f"    {cty} / {r['town_name']}: {st2} {repr(e)[:80]} {b2[:120]}")
                          time.sleep(0.4)

          # HUD USPS crosswalk, ZIP -> county subdivision
          for q in ("06001", "06902", "01852", "CT", "All"):
              for typ in (11,):
                  st, b = get(f"{H}/usps?type={typ}&query={q}", HDR)
                  try:
                      d = json.loads(b)
                      data = d.get("data", d)
                      res = data.get("results", []) if isinstance(data, dict) else []
                      print(f"== usps type={typ} query={q}: {st}", {k: v for k, v in data.items() if k != 'results'} if isinstance(data, dict) else "",
                            len(res), res[:3])
                  except Exception as e:
                      print(f"== usps type={typ} query={q}: {st}", repr(e)[:80], b[:300])
          PY
