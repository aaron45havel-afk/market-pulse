name: TEMPORARY — Connecticut + New England data run

# Runs the hazards refresh (Connecticut tracts now renumbered) and the rents
# refresh for the six town-level HUD states on this branch, and commits the
# data to the branch for review. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-ct.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Suites first
        run: |
          python tests/test_zip_env.py
          python tests/test_zip_env_fetch.py
          python tests/test_rent_ladder.py
          python tests/test_rents_build.py
      - name: Hazards
        run: python -u scripts/refresh_zip_hazards.py
      - name: Before — New England rents as stored
        run: |
          python3 - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/zips.db")
          for r in c.execute("select state, count(*), sum(rent_tier is null), sum(rent_fmr is not null), "
                             "sum(rent_safmr is not null), count(distinct rent_fmr) from zips "
                             "where state in ('CT','MA','ME','NH','RI','VT') group by state"):
              print("before", r)
          PY
      - name: Rents — HUD for the town-level states, ZORI + ACS everywhere
        env:
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: python -u scripts/refresh_rents.py --states CT,MA,ME,NH,RI,VT
      - name: After
        run: |
          python3 - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/zips.db")
          for r in c.execute("select state, count(*), sum(rent_tier is null), sum(rent_fmr is not null), "
                             "sum(rent_safmr is not null), count(distinct rent_fmr) from zips "
                             "where state in ('CT','MA','ME','NH','RI','VT') group by state"):
              print("after", r)
          print("national", c.execute("select count(*), sum(rent_tier is null), sum(rent_acs is not null) from zips").fetchone())
          for r in c.execute("select rent_tier, count(*) from zips group by rent_tier"):
              print("  tier", r)
          for z in ("06103", "06902", "06001", "06516", "01510", "01605", "01852", "02139", "04401"):
              print(" ", c.execute("select zip, name, rent_tier, median_rent_monthly, rent_fmr, rent_safmr, rent_acs from zips where zip=?", (z,)).fetchone())
          PY
      - name: Commit the data to this branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/zip_hazards.json market-pulse-v21/data/zips.db
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: Connecticut hazards + New England town rents (branch data run)"
          git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r
