name: TEMPORARY — find the Connecticut crosswalk

# Finds the Census file mapping CT's 2020 tracts to the 2022 planning-region
# tracts, and checks what FEMA and HUD now use for CT. Read-only. Deleted
# before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-ct.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Census CT change files, FEMA CT tracts, HUD CT areas
        env:
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: |
          python3 -u - <<'PY'
          import json, os, re, urllib.request, urllib.error, urllib.parse
          UA = {"User-Agent": "MarketPulse/1.0 (ct probe)"}
          def get(url, headers=None, n=None):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={**UA, **(headers or {})}), timeout=60) as r:
                      b = r.read() if n is None else r.read(n)
                      return r.status, b
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:200]
              except Exception as e:
                  return None, repr(e).encode()
          for d in ("https://www2.census.gov/geo/docs/reference/ct_change/",
                    "https://www2.census.gov/geo/docs/maps-data/data/rel2022/",
                    "https://www2.census.gov/geo/docs/maps-data/data/rel2022/tract22/"):
              st, b = get(d)
              names = re.findall(r'href="([^"?/][^"]*)"', b.decode("utf-8", "replace")) if st == 200 else []
              print(f"== {d}: {st}", [n for n in names if not n.startswith("http")][:40], flush=True)
          # candidate crosswalk files: print head of any txt/csv in ct_change
          st, b = get("https://www2.census.gov/geo/docs/reference/ct_change/")
          for n in re.findall(r'href="([^"?/][^"]*\.(?:txt|csv))"', b.decode("utf-8", "replace")) if st == 200 else []:
              st2, body = get("https://www2.census.gov/geo/docs/reference/ct_change/" + n)
              lines = body.decode("utf-8", "replace").splitlines()
              print(f"-- {n}: {st2}, {len(lines)} lines")
              for ln in lines[:4]:
                  print("     ", ln[:220])
          # FEMA NRI CT tracts
          q = urllib.parse.urlencode({"where": "STATEABBRV='CT'", "outFields": "TRACTFIPS,COUNTY,COUNTYFIPS",
                                      "returnGeometry": "false", "resultRecordCount": 5, "f": "json"})
          st, b = get("https://services.arcgis.com/XG15cJAlne2vxtgt/arcgis/rest/services/National_Risk_Index_Census_Tracts/FeatureServer/0/query?" + q)
          print("== FEMA CT sample:", st, b[:600])
          q = urllib.parse.urlencode({"where": "STATEABBRV='CT'", "returnCountOnly": "true", "f": "json"})
          print("   FEMA CT tract count:", get("https://services.arcgis.com/XG15cJAlne2vxtgt/arcgis/rest/services/National_Risk_Index_Census_Tracts/FeatureServer/0/query?" + q)[1][:200])
          # HUD CT areas
          tok = os.environ.get("HUD_API_TOKEN", "")
          st, b = get("https://www.huduser.gov/hudapi/public/fmr/listCounties/CT", {"Authorization": "Bearer " + tok})
          print("== HUD listCounties/CT:", st)
          try:
              for c in json.loads(b):
                  print("    ", c.get("fips_code"), c.get("county_name"), c.get("town_name"))
          except Exception as e:
              print("   ", b[:300])
          PY
