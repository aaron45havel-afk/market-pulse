name: TEMPORARY — tickers per CIK and fund companyfacts

# Read-only. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-unmeasured.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          python3 -u - <<'PY'
          import gzip, json, urllib.request, urllib.error, collections, re
          SEC = {"User-Agent": "market-pulse-research admin@focusedops.io", "Accept-Encoding": "gzip, deflate"}
          def get(url):
              req = urllib.request.Request(url, headers=SEC)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      b = r.read()
                      return r.status, json.loads(gzip.decompress(b) if r.headers.get("Content-Encoding") == "gzip" else b)
              except urllib.error.HTTPError as e:
                  return e.code, None
          st, d = get("https://www.sec.gov/files/company_tickers.json")
          by = collections.defaultdict(list)
          for k in sorted(d, key=int):
              e = d[k]; by[e["cik_str"]].append(e["ticker"])
          multi = {c: t for c, t in by.items() if len(t) > 1}
          print("entries", len(d), "ciks", len(by), "multi-ticker ciks", len(multi))
          suff = re.compile(r"[-.][A-Z0-9]+$")
          first_plain = sum(1 for t in multi.values() if not suff.search(t[0]))
          last_plain = sum(1 for t in multi.values() if not suff.search(t[-1]))
          print("first ticker has no suffix:", first_plain, "| last has none:", last_plain)
          for c in (12927, 915913, 14930, 1318605, 1067983, 1652044):
              print(c, by.get(c))
          odd = [(c, t) for c, t in multi.items() if suff.search(t[0])][:25]
          print("first-with-suffix sample:", odd)
          # funds: companyfacts status
          st2, ex = get("https://www.sec.gov/files/company_tickers_exchange.json")
          f = ex["fields"]; rows = ex["data"]
          ci, ti, ni = f.index("cik"), f.index("ticker"), f.index("name")
          funds = [r for r in rows if re.search(r"Fund|Municipal|Income Trust|Credit Strateg", r[ni] or "")][:12]
          for r in funds:
              s, j = get(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{int(r[ci]):010d}.json")
              has = sorted((j or {}).get("facts", {}).keys()) if j else None
              print("fund", r[ti], r[ni][:35], "status", s, "taxonomies", has)
          PY
