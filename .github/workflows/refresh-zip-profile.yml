# Builds market-pulse-v21/data/zip_profile.db and data/zip_series.json.gz —
# the dataset behind the rebuilt map and ZIP page (scripts/build_zip_profile.py).
# Runs on the 3rd, after refresh-national-zips (1st) and refresh-rents (2nd),
# because it carries HUD bedroom rents from zips.db rather than calling HUD.
name: Refresh ZIP profile (map rebuild)

on:
  schedule:
    - cron: '0 18 3 * *'   # 18:00 UTC on the 3rd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the parsers and the underwriting before spending any downloads
        run: |
          python tests/test_acs_bulk.py
          python tests/test_zip_profile.py
          python tests/test_underwrite.py

      - name: Build the ZIP profile
        run: python scripts/build_zip_profile.py

      - name: Commit + push if changed
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/zip_profile.db market-pulse-v21/data/zip_series.json.gz
          if git diff --staged --quiet; then
            echo "No change to the ZIP profile — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh ZIP profile

          Auto-generated by .github/workflows/refresh-zip-profile.yml.
          Source vintages are in the database's meta table."
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push attempt $attempt failed — pulling rebase and retrying."
            sleep $((attempt * 5))
            git pull --rebase origin main || true
          done
