name: TEMPORARY — cash tags on the latest balance sheet

# Read-only. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-debt.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 -u - <<'PY'
          import collections, gzip, json, re, sys, time, urllib.request
          sys.path.insert(0, "."); sys.path.insert(0, "scripts")
          import refresh_compounders as R
          SEC = {"User-Agent": "market-pulse-research admin@focusedops.io", "Accept-Encoding": "gzip, deflate"}
          def get(url):
              for i in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=SEC), timeout=60) as r:
                          b = r.read()
                          return json.loads(gzip.decompress(b) if r.headers.get("Content-Encoding") == "gzip" else b)
                  except Exception:
                      time.sleep(2)
              raise RuntimeError(url)
          rows = json.load(open("data/compounders.json"))["tickers"]
          PAT = re.compile(r"Debt|Borrowing|Notes|Loan|Obligation|Payable|Bond|Credit", re.I)
          SKIP = re.compile(r"Payments|Proceeds|Repayments|Interest|Receivable|Accounts|Accrued|Taxes|Dividend|Lease|Fair|Amortization|Issuance|Gain|Loss|Extinguish|Increase|Decrease|Maturit|Weighted|Percent|Rate|Covenant|Securities|Purchase|Performance|Benefit|Retirement|Capacity|Guarantee|Contractual|Excise|Trade", re.I)
          for t in "ADUS BMI CVGI EVI FTLF HOV IPAR JACK PCAR PFGC SLB SMP TRAK TWIN".split():
              r = rows[t]
              f = get(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{int(r['cik']):010d}.json")["facts"]
              time.sleep(0.15)
              bs = R.balance_sheet(f, want_unit=r["currency"], revenue=r.get("revenue_last"))
              ref, unit = bs["as_of"], bs["unit"]
              anchors = {k: R._instant_at(f, R.BALANCE_TAGS[k], ref, unit) for k in ("equity", "liabilities", "cash")}
              last_cash = R._latest_instant(f, R.BALANCE_TAGS["cash"], unit)
              at = []
              for tax, tags in f.items():
                  for tag, node in tags.items():
                      if not re.search(r"Cash", tag) or re.search(r"Flow|Paid|Received|Proceeds|Payments|Dividend|Increase|Decrease|Period|Settled|Collateral|Surrender|Transfer|Acquired|Restricted", tag):
                          continue
                      hits = [v for v in (node.get("units") or {}).get(unit, []) if v.get("end") == ref and not v.get("start") and v.get("form") in R.ANNUAL_FORMS]
                      if hits:
                          at.append(f"{tag}={max(hits, key=lambda v: v.get('filed') or '')['val']/1e6:,.0f}m")
              print(f"== {t} ref={ref} {unit} anchors={anchors} latest cash slot={last_cash}")
              print("     ", "; ".join(at[:10]))
          PY
