name: TEMPORARY — measured debt too small for the interest paid

# Read-only. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-debt.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 -u - <<'PY'
          import collections, gzip, json, re, sys, time, urllib.request
          sys.path.insert(0, "."); sys.path.insert(0, "scripts")
          import refresh_compounders as R
          SEC = {"User-Agent": "market-pulse-research admin@focusedops.io", "Accept-Encoding": "gzip, deflate"}
          def get(url):
              for i in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=SEC), timeout=60) as r:
                          b = r.read()
                          return json.loads(gzip.decompress(b) if r.headers.get("Content-Encoding") == "gzip" else b)
                  except Exception:
                      time.sleep(2)
              raise RuntimeError(url)
          rows = json.load(open("data/compounders.json"))["tickers"]
          PAT = re.compile(r"Debt|Borrowing|Notes|Loan|Obligation|Payable|Bond|Credit", re.I)
          SKIP = re.compile(r"Payments|Proceeds|Repayments|Interest|Receivable|Accounts|Accrued|Taxes|Dividend|Lease|Fair|Amortization|Issuance|Gain|Loss|Extinguish|Increase|Decrease|Maturit|Weighted|Percent|Rate|Covenant|Securities|Purchase|Performance|Benefit|Retirement|Capacity|Guarantee|Contractual|Excise|Trade", re.I)
          flagged = []
          n = 0
          for t in sorted(rows):
              r = rows[t]
              d = r.get("total_debt")
              if d is None or r.get("bs_as_of") is None:
                  continue
              if t not in ("ON", "SKM"):
                  pass
              try:
                  f = get(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{int(r['cik']):010d}.json")["facts"]
              except Exception as e:
                  print(t, "fetch failed"); continue
              n += 1
              time.sleep(0.11)
              unit, ref = r["bs_unit"], r["bs_as_of"]
              ie = R._duration_at(f, R.INTEREST_SLOTS, ref, unit)
              if ie is None:
                  continue
              ie = abs(ie)
              rev = r.get("revenue_last") or 0
              implied = ie / d if d else float("inf")
              if (implied > 0.20 and rev and ie >= R.DEBT_FREE_INTEREST_MAX * rev) or t in ("ON", "SKM"):
                  at = []
                  for tax, tags in f.items():
                      for tag, node in tags.items():
                          if not PAT.search(tag) or SKIP.search(tag):
                              continue
                          hits = [v for v in (node.get("units") or {}).get(unit, [])
                                  if v.get("end") == ref and not v.get("start") and v.get("form") in R.ANNUAL_FORMS]
                          if hits:
                              val = max(hits, key=lambda v: v.get("filed") or "")["val"]
                              at.append(f"{'' if tax == 'us-gaap' else tax + ':'}{tag}={val/1e6:,.0f}m")
                  bs = R.balance_sheet(f, want_unit=unit, revenue=rev)
                  flagged.append(t)
                  print(f"== {t} debt={d/1e6:,.0f}m interest={ie/1e6:,.1f}m ({implied if d else 0:.0%} implied) rev={rev/1e6:,.0f}m {unit} ref={ref} notes={bs['notes']}")
                  print("     ", "; ".join(at[:18]))
          print("\nchecked", n, "flagged", len(flagged))
          print(" ".join(flagged))
          PY
