name: TEMPORARY — what the unknown-debt rows file on their latest balance sheet

# Read-only. Deleted before the branch merges.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-debt.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 -u - <<'PY'
          import collections, gzip, json, re, sys, time, urllib.request
          sys.path.insert(0, "."); sys.path.insert(0, "scripts")
          import refresh_compounders as R
          SEC = {"User-Agent": "market-pulse-research admin@focusedops.io", "Accept-Encoding": "gzip, deflate"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=SEC), timeout=60) as r:
                  b = r.read()
                  return json.loads(gzip.decompress(b) if r.headers.get("Content-Encoding") == "gzip" else b)
          rows = json.load(open("data/compounders.json"))["tickers"]
          unk = sorted(t for t, r in rows.items() if r.get("total_debt") is None)
          print("unknown rows:", len(unk))
          PAT = re.compile(r"Debt|Borrowing|Notes|Loan|Obligation|Payable", re.I)
          SKIP = re.compile(r"Payments|Proceeds|Repayments|Interest|Receivable|Accounts|Accrued|Taxes|Dividend|Lease|Fair|Amortization|Issuance|Gain|Loss|Extinguish|Increase|Decrease|Maturit|Weighted|Percent|Rate|Covenant|Term$", re.I)
          debt_slots = [s for k in R.DEBT_KEYS for s in R.BALANCE_TAGS[k]]
          tag_count = collections.Counter()
          cats = collections.Counter()
          for t in unk:
              r = rows[t]
              try:
                  f = get(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{int(r['cik']):010d}.json")["facts"]
              except Exception as e:
                  print(t, "fetch failed", e); continue
              time.sleep(0.12)
              bs = R.balance_sheet(f)
              ref, unit = bs["as_of"], bs["unit"]
              # the newest debt-slot fact of all
              last = None
              for tax, tag in debt_slots:
                  for v in (((f.get(tax) or {}).get(tag) or {}).get("units") or {}).get(unit, []):
                      if v.get("form") in R.ANNUAL_FORMS and not v.get("start") and isinstance(v.get("val"), (int, float)):
                          k = (v["end"], v.get("filed") or "")
                          if last is None or k > last[0]:
                              last = (k, tag, v["val"])
              # the filing carrying the latest balance sheet: does it still tag the old line for the prior year?
              filed_ref = max((v.get("filed") or "" for tax, tag in R.BALANCE_TAGS["equity"] + R.BALANCE_TAGS["liabilities"]
                               for v in (((f.get(tax) or {}).get(tag) or {}).get("units") or {}).get(unit, [])
                               if v.get("end") == ref and v.get("form") in R.ANNUAL_FORMS), default="")
              compar = []
              for tax, tag in debt_slots:
                  for v in (((f.get(tax) or {}).get(tag) or {}).get("units") or {}).get(unit, []):
                      if v.get("filed") == filed_ref and not v.get("start") and v.get("end") != ref:
                          compar.append(f"{tag}@{v['end']}={v['val']/1e6:.0f}m")
              ie = None
              for tag in ("InterestExpense", "InterestExpenseNonoperating", "InterestExpenseDebt", "InterestPaidNet", "InterestExpenseBorrowings"):
                  for tax in ("us-gaap", "ifrs-full"):
                      for v in (((f.get(tax) or {}).get(tag) or {}).get("units") or {}).get(unit, []):
                          if v.get("start") and v.get("end") == ref and v.get("form") in R.ANNUAL_FORMS:
                              ie = (tag, v["val"])
                  if ie: break
              at_ref = []
              for tax in ("us-gaap", "ifrs-full") + tuple(k for k in f if k not in ("us-gaap", "ifrs-full", "dei", "srt", "invest")):
                  for tag, node in (f.get(tax) or {}).items():
                      if not PAT.search(tag) or SKIP.search(tag):
                          continue
                      hits = [v for v in (node.get("units") or {}).get(unit, [])
                              if v.get("end") == ref and not v.get("start") and v.get("form") in R.ANNUAL_FORMS]
                      if hits:
                          val = max(hits, key=lambda v: v.get("filed") or "")["val"]
                          at_ref.append(f"{tax if tax not in ('us-gaap',) else ''}:{tag}={val/1e6:.0f}m")
                          tag_count[(tax, tag)] += 1
              cat = "partial" if any("only short-term" in n for n in bs["notes"]) else "moved"
              cat += "+ie" if ie and ie[1] else "+noie"
              cat += "+tags" if at_ref else "+notags"
              cats[cat] += 1
              lastd = f"{last[1]}@{last[0][0]} filed {last[0][1]} = {last[2]/1e6:.0f}m" if last else None
              print(f"== {t} ref={ref} {unit} [{cat}] last={lastd} ie={ie} compar={compar[:3]}")
              if at_ref: print("     at ref:", "; ".join(at_ref[:12]))
          print("\nCATEGORIES", dict(cats))
          print("\nTAGS AT REF ACROSS UNKNOWNS")
          for (tax, tag), n in tag_count.most_common(60):
              print(f"  {n:4d} {tax}:{tag}")
          PY
