name: TEMPORARY — rebuild compounders, FCF quality and Lynch on the branch

# Branch data run for the tag-reading fixes. Commits the rebuilt data to
# this branch for review. Deleted before the branch merges.
# Run 4: one-kind totals take the largest and must cover the debt due this year.
on:
  push:
    branches: [claude/legal-rep-invoice-tracking-9j1i9r]
    paths:
      - '.github/workflows/probe-data.yml'

permissions:
  contents: write

jobs:
  compounders:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: market-pulse-v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Suites first
        run: |
          python tests/test_compounders_series.py
          python tests/test_compounders_score.py
          python tests/test_compounders_market.py
          python tests/test_fcf_quality.py
          python tests/test_freshness.py
      - name: Compounders
        run: python -u scripts/refresh_compounders.py
      - name: FCF quality from the new compounders file
        run: python -u scripts/build_fcf_quality.py --force
      - name: Commit to this branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse-v21/data/compounders.json market-pulse-v21/data/fcf_quality_snapshots
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: compounders + FCF quality rebuild (branch data run)"
          for i in 1 2 3 4; do git push origin HEAD:claude/legal-rep-invoice-tracking-9j1i9r && exit 0; sleep $((i*5)); git pull --rebase origin claude/legal-rep-invoice-tracking-9j1i9r; done; exit 1

